    <div class="container">
        <input type="checkbox" style="display: none" id="toggle" class="hidden">
        <div class="form-container">
            <form class="form login" action="/sae-s4.a02.1/login">
                <h2>Connexion</h2>
                <input type="text" id="pseudo" name="pseudo" placeholder="Pseudo" required>
                <input type="password" id="mdp" name="mdp" placeholder="Mot de passe" required>
                <button type="submit">Se connecter</button>
                <label class="switch" for="toggle">Pas encore inscrit ?</label>
            </form>
            <form class="form register" action="/sae-s4.a02.1/register">
                <h2>Inscription</h2>
                <input type="text" id="pseudo" name="pseudo" placeholder="Pseudo" required>
                <input type="text" id="prenom" name="prenom" placeholder="Prénom" required>
                <input type="text" id="nom" name="nom" placeholder="Nom" required>
                <input type="date" id="anniv" name="anniv" placeholder="Date d'anniversaire" required>
                <input type="email" id="email" name="email" placeholder="Email" required>
                <input type="password" id="mdp" name="mdp" placeholder="Mot de passe" required>
                <button type="submit">S'inscrire</button>
                <label class="switch" for="toggle">Déjà inscrit ?</label>
            </form>
        </div>
    </div>
